!
! osmo-gbproxy.cfg — исправленная версия
!
sgsn nsei 2

ns
 ! --- Сторона BSS: приём от сторонней BSS ---
 bind udp bss-side
  listen 192.168.250.45 23003
  accept-dynamic-ip-sns
 ip-sns-default bind bss-side

 ! --- Сторона SGSN: отправка в OsmoSGSN ---
 bind udp sgsn-side
  listen 127.0.0.1 23001
  accept-ipaccess

 ! NSE для BSS (автоуправляемый через SNS, можно не указывать явно)
 ! NSE для SGSN
 nse 2
  ip-sns-bind sgsn-side
  ip-sns-remote 127.0.0.1 23000
 

 ! Таймеры (опционально, но рекомендованы)
 timer tns-block 30
 timer tns-block-retries 30
 timer tns-reset 30
 timer tns-reset-retries 3
 timer tns-test 300
 timer tns-alive 30
 timer tns-alive-retries 100
