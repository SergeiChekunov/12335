!
log stderr
 logging color 1
 logging print category 1
 logging print level 1

 ! Включаем максимальный уровень для GMM и LLC
 logging level llc debug
 logging level gprs debug
 logging level bssgp debug
 logging level mm debug
 logging level lglobal debug
!


line vty
 no login

sgsn
 gtp local-ip 10.179.0.13
 gtp state-dir /var/lib/osmocom/osmo-sgsn
 timer t3314 500     
! timer implicit-attach-timeout 3600
 timer t3312 3600
 ! gtp echo-interval 60
 ggsn 0 remote-ip 10.179.0.3
 ggsn 0 gtp-version 1 
 apn internet ggsn 0
 gsup remote-ip 127.0.0.1
 gsup remote-port 4222
 authentication required
 auth-policy remote
 ! apn internet imsi-prefix 00101 ggsn 0
 ! ggsn dynamic
    ! Тогда не нужно указывать ggsn 0 remote-ip
    ! SGSN будет делать DNS-запрос: <apn>.gprs
    !apn internet ggsn dynamic
ns
 !encapsulation udp local-ip 192.171.0.5
 !encapsulation udp local-port 23000
 bind udp gb-side
  listen 127.0.0.1 23000
  accept-ipaccess
  accept-dynamic-ip-sns
     

 !

 
!

